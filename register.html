<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>BlogSphere | Register</title><link rel="stylesheet" href="css/style.css"></head>
<body class="auth-page">
<header class="navbar"><a href="index.html" class="logo">Blog<span>Sphere</span></a><nav><a href="index.html">Home</a><a href="login.html">Login</a></nav></header>
<main class="auth-container"><form class="auth-card" id="registerForm"><p class="eyebrow">JOIN THE COMMUNITY</p><h1>Create an account</h1><p class="muted">Start publishing your ideas today.</p>
<label>Full Name</label><input id="registerName" type="text" placeholder="Your name" required>
<label>Email</label><input id="registerEmail" type="email" placeholder="you@example.com" required>
<label>Password</label><input id="registerPassword" type="password" minlength="6" placeholder="At least 6 characters" required>
<button class="btn primary full" type="submit">Create Account</button><p id="registerMessage" class="form-message"></p>
<p class="switch">Already have an account? <a href="login.html">Login</a></p></form></main>
<script src="js/script.js"></script></body></html>
