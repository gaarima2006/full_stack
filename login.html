<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>BlogSphere | Login</title><link rel="stylesheet" href="css/style.css"></head>
<body class="auth-page">
<header class="navbar"><a href="index.html" class="logo">Blog<span>Sphere</span></a><nav><a href="index.html">Home</a><a href="register.html">Register</a></nav></header>
<main class="auth-container"><form class="auth-card" id="loginForm"><p class="eyebrow">WELCOME BACK</p><h1>Login to BlogSphere</h1><p class="muted">Continue writing and exploring amazing stories.</p>
<label>Email</label><input id="loginEmail" type="email" placeholder="you@example.com" required>
<label>Password</label><input id="loginPassword" type="password" placeholder="••••••••" required>
<button class="btn primary full" type="submit">Login</button><p id="loginMessage" class="form-message"></p>
<p class="switch">Don't have an account? <a href="register.html">Register</a></p></form></main>
<script src="js/script.js"></script></body></html>
